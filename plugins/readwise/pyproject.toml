[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["readwise_common*"]

[project]
name = "readwise-skill"
version = "0.2.1"
description = "Claude Code plugin for Readwise Original and Reader APIs"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "flask>=2.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/ryanlyn/readwise-skill"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=readwise_common --cov=skills/readwise/scripts --cov=skills/readwise-reader/scripts --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "readwise_common",
    "skills/readwise/scripts",
    "skills/readwise-reader/scripts",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
