[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["readwise_common*"]

[project]
name = "readwise-skill"
version = "0.1.0"
description = "Claude Code plugin for Readwise Original and Reader APIs"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "flask>=2.3.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/ryanlyn/readwise-skill"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
